<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Card Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <main class="checkout-wrapper">


    <section class="card-preview">
      <div class="scene">
        <div class="credit-card" id="creditCard">


          <div class="card-face card-front">
            <div class="top-row">
              <div class="chip"></div>
              <span class="brand" id="cardBrand">CARD</span>
            </div>


            <div class="card-number" id="previewNumber">
              0000 0000 0000 0000
            </div>


            <div class="card-bottom">
              <div>
                <span class="label">CARD HOLDER</span>
                <strong id="previewName">YOUR NAME</strong>
              </div>


              <div>
                <span class="label">EXPIRES</span>
                <strong id="previewExpiry">MM/YY</strong>
              </div>
            </div>
          </div>


          <div class="card-face card-back">
            <div class="black-strip"></div>


            <div class="signature-row">
              <div class="signature"></div>
              <div class="cvv-box" id="previewCvv">000</div>
            </div>


            <p>
              Demo card only. Do not enter real payment details.
            </p>
          </div>


        </div>
      </div>
    </section>




    <section class="checkout-panel">


      <div class="heading">
        <span>SECURE CHECKOUT</span>
        <h1>Complete Payment</h1>
        <p>Interactive card preview with live validation.</p>
      </div>


      <form id="paymentForm">


        <div class="input-group">
          <label for="cardNumber">Card Number</label>
          <input
            type="text"
            id="cardNumber"
            placeholder="1234 5678 9012 3456"
            maxlength="19"
            autocomplete="off"
          >
          <small id="numberError"></small>
        </div>


        <div class="input-group">
          <label for="cardName">Card Holder</label>
          <input
            type="text"
            id="cardName"
            placeholder="YUKESH OLI"
            maxlength="30"
            autocomplete="off"
          >
          <small id="nameError"></small>
        </div>


        <div class="row">
          <div class="input-group">
            <label for="expiry">Expiry</label>
            <input
              type="text"
              id="expiry"
              placeholder="MM/YY"
              maxlength="5"
              autocomplete="off"
            >
            <small id="expiryError"></small>
          </div>


          <div class="input-group">
            <label for="cvv">CVV</label>
            <input
              type="password"
              id="cvv"
              placeholder="123"
              maxlength="3"
              autocomplete="off"
            >
            <small id="cvvError"></small>
          </div>
        </div>


        <button type="submit" id="payBtn">
          <span class="btn-text">Pay Now</span>
          <span class="spinner"></span>
        </button>


      </form>


    </section>


  </main>




  <div class="success-screen" id="successScreen">
    <div class="success-card">
      <div class="checkmark">✓</div>


      <h2>Payment Successful</h2>


      <p>Your demo payment has been completed.</p>


      <button id="resetBtn">
        Make Another Payment
      </button>
    </div>
  </div>




  <div class="confetti-container" id="confettiContainer"></div>


  <script src="script.js"></script>
</body>
</html>
